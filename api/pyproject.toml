[project]
name = "focusframe-api"
version = "0.1.0"
description = "FocusFrame analysis API: DeepGaze IIE attention prediction for static ads"
requires-python = ">=3.10"
# Exact versions used for the recorded evaluation live in requirements.lock.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "torch>=2.6",
    "torchvision>=0.21",
    "deepgaze_pytorch @ git+https://github.com/matthias-k/DeepGaze.git@c7db17e2d1d7ea6468ffdee2cfaddf141095dcff",
    # Imported unconditionally by deepgaze_pytorch/__init__.py (DeepGaze MSDB); unused by IIE.
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "psutil>=5.9"]

[tool.setuptools]
packages = ["focusframe_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires downloaded DeepGaze IIE weights (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File(...) default is idiomatic

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
